<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Store Access</title><style>body{font:16px system-ui;max-width:580px;margin:6vh auto;padding:24px;line-height:1.6}input,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box}button{cursor:pointer}#status{min-height:2em}section{border:1px solid #ddd;border-radius:12px;padding:18px;margin-top:16px}</style></head><body><h1>Secure store access</h1><p>Sign in to purchase or access your verified downloads. Purchases are not unlocked by a redirect or browser flag.</p><section><form id="login"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><button id="register">Create account</button><button id="signout">Sign out</button></section><section><div id="paypal-buttons"></div><button id="download">Download verified ebook</button></section><p id="status" role="status"></p><script type="module" src="./store-auth.js"></script></body></html>
